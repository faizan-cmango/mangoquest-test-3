riskmap: spec/sync_fifo/riskmap.yaml@v0.1
blocks:
  - id: sync_fifo
    risk: MEDIUM
    rationale: "One clock, no crossing, a small occupancy range; the risks are data integrity at the full and empty boundaries and the combinational out_ready to in_ready path (ADR-01)."
    factors: {interfaces: 2, cdc_crossings: 0, fsm_states: 0, protocol_complexity: low, novelty: low}
    targets: {coverage: {line: 100, branch: 100, toggle: 95, fsm: 100, functional: 100}}
    formal_properties_required: [REQ-3.1.1, REQ-3.1.3]
    register_entries: [R-01, R-02]
register:
  - {id: R-01, block: sync_fifo, severity: MEDIUM, status: open, text: "Off-by-one at full or empty (17th word, lost word on simultaneous transfer at 16).", mitigation: "Formal proof of REQ-3.1.1 and REQ-3.1.3; directed scenarios VPS-03 and VPS-06."}
  - {id: R-02, block: sync_fifo, severity: MEDIUM, status: open, text: "out_ready to in_ready feed-through and the 16:1 read mux limit 200 MHz timing.", mitigation: "Feasibility run before sign-off (section 6.1); fallback proposal in section 8 if it misses."}
