idd: IDD-M_OUT
version: "0.1"
block: sync_fifo
side: master
protocol_class: valid-ready
sad_section: "3.1"
clock: core_clk
reset: rst_n
ports:
  - {name: out_valid, dir: out, width: 1, type: logic, req: REQ-3.2.5, reset_value: 0, meaning: "1 while at least one word is held; changes only at a core_clk rising edge"}
  - {name: out_data, dir: out, width: 32, type: logic, req: REQ-3.1.2, reset_value: 0, meaning: "the oldest word held, meaningful while out_valid is 1; changes only at a core_clk rising edge"}
  - {name: out_ready, dir: in, width: 1, type: logic, req: REQ-3.1.2, reset_value: n/a, meaning: "sink takes out_data at this edge when out_valid is 1"}
omitted_signals: []
rules:
  - {id: R1, holder: slave, req: REQ-3.1.3, text: "While out_valid is 1 and out_ready is 0, out_valid stays 1 and out_data keeps its value"}
  - {id: R2, holder: master, req: REQ-3.1.2, text: "The sink may change out_ready at any time, including while out_valid is 0; out_ready is not required to wait for out_valid"}
  - {id: R3, holder: slave, req: REQ-3.3.2, text: "After a rising edge with rst_n at 0, out_valid and out_data are 0"}
timing:
  - {req: REQ-3.1.4, clock: core_clk, from: "word accepted into an empty FIFO", to: "out_valid is 1 with that word on out_data", cycles: 1, text: "visible immediately after the accepting edge"}
corner_cases:
  - {id: C1, req: REQ-3.1.3, text: "sink stalls for many cycles: out_valid and out_data hold", vps: VPS-04}
  - {id: C2, req: REQ-3.2.5, text: "last held word taken with no word accepted: out_valid goes to 0", vps: VPS-10}
  - {id: C3, req: REQ-3.1.4, text: "out_ready 1 while the FIFO is empty: nothing is taken, an accepted word appears with out_valid 1", vps: VPS-02}
registers: []
errata_applied: []
