idd: IDD-S_IN
version: "0.1"
block: sync_fifo
side: slave
protocol_class: valid-ready
sad_section: "4.1"
clock: core_clk
reset: rst_n
ports:
  - {name: core_clk, dir: in, width: 1, type: logic, req: REQ-4.1.1, reset_value: n/a, meaning: "Clock, 200 MHz; every transfer is sampled at its rising edge"}
  - {name: rst_n, dir: in, width: 1, type: logic, req: REQ-3.2.1, reset_value: n/a, meaning: "Active-low synchronous reset; while 0 the FIFO is empty and closed"}
  - {name: in_valid, dir: in, width: 1, type: logic, req: REQ-3.1.2, reset_value: n/a, meaning: "Upstream has a word on in_data"}
  - {name: in_data, dir: in, width: 32, type: logic, req: REQ-3.1.2, reset_value: n/a, meaning: "Word to enqueue, sampled at an accepting edge"}
  - {name: in_ready, dir: out, width: 1, type: logic, req: REQ-3.1.3, reset_value: 0, meaning: "FIFO can accept a word this cycle: 1 when fewer than 16 words are held or out_ready is 1; 0 while rst_n is 0"}
omitted_signals: []
rules:
  - {id: R1, holder: master, req: REQ-3.1.2, text: "A word is accepted at a core_clk rising edge with in_valid 1 and in_ready 1 and rst_n 1."}
  - {id: R2, holder: slave, req: REQ-3.1.6, text: "in_ready may depend combinationally on out_ready in the same cycle; it does not depend on in_valid or in_data."}
  - {id: R3, holder: master, req: REQ-3.1.2, text: "The master need not hold in_valid or in_data while in_ready is 0; no stability is required of it."}
  - {id: R4, holder: slave, req: REQ-3.2.1, text: "in_valid is ignored while rst_n is 0."}
timing:
  - {req: REQ-3.1.7, clock: core_clk, from: "accepting edge into an empty FIFO", to: "out_valid 1 on IDD-M_OUT", cycles: 1, text: "A word is visible at the output one cycle after its accepting edge."}
  - {req: REQ-3.1.6, clock: core_clk, from: "out_ready 1 with 16 words held", to: "in_ready 1", cycles: 0, text: "Same cycle: combinational."}
corner_cases:
  - {id: C1, req: REQ-3.1.3, text: "16th word accepted with out_ready 0: in_ready goes to 0 for the next cycle.", vps: VPS-03}
  - {id: C2, req: REQ-3.1.6, text: "16 words held, out_ready 1, in_valid 1: accept and release at one edge, occupancy stays 16.", vps: VPS-06}
  - {id: C3, req: REQ-3.2.1, text: "in_valid 1 while rst_n is 0: nothing accepted, in_ready 0.", vps: VPS-08}
  - {id: C4, req: REQ-3.1.5, text: "Accept and release at one edge with 1 to 15 words held: occupancy unchanged.", vps: VPS-05}
errata_applied: []
