idd: IDD-S_IN
version: "0.1"
block: sync_fifo
side: slave
protocol_class: valid-ready
sad_section: "3.1"
clock: core_clk
reset: rst_n
ports:
  - {name: core_clk, dir: in, width: 1, type: logic, req: REQ-6.1.1, reset_value: n/a, meaning: "clock, 200 MHz; every transfer and every change of out_valid and out_data is at its rising edge"}
  - {name: rst_n, dir: in, width: 1, type: logic, req: REQ-3.3.2, reset_value: n/a, meaning: "active-low synchronous reset: 0 empties the FIFO at the rising edge"}
  - {name: in_valid, dir: in, width: 1, type: logic, req: REQ-3.1.1, reset_value: n/a, meaning: "source offers a word"}
  - {name: in_data, dir: in, width: 32, type: logic, req: REQ-3.1.1, reset_value: n/a, meaning: "the word offered, valid while in_valid is 1"}
  - {name: in_ready, dir: out, width: 1, type: logic, req: REQ-3.2.2, reset_value: 0, meaning: "FIFO can accept a word at this edge: 1 when fewer than 16 words are held or when out_ready takes one; 0 while rst_n is 0"}
omitted_signals: []
rules:
  - {id: R1, holder: master, req: REQ-3.1.1, text: "While in_valid is 1 and in_ready is 0 the source keeps in_valid at 1 and in_data unchanged until the transfer"}
  - {id: R2, holder: slave, req: REQ-3.2.3, text: "in_ready may depend on out_ready in the same cycle (a combinational path); it never depends on in_valid or in_data"}
  - {id: R3, holder: slave, req: REQ-3.3.1, text: "No word is accepted while rst_n is 0: in_ready is 0 and in_valid is ignored"}
timing:
  - {req: REQ-3.2.3, clock: core_clk, from: "out_ready changes while 16 words are held", to: "in_ready follows", cycles: 0, text: "same cycle, combinational"}
  - {req: REQ-3.3.1, clock: core_clk, from: "rst_n goes to 0", to: "in_ready is 0", cycles: 0, text: "same cycle, combinational"}
corner_cases:
  - {id: C1, req: REQ-3.2.3, text: "FIFO full with in_valid and out_ready both 1: one word taken and one accepted at the same edge", vps: VPS-07}
  - {id: C2, req: REQ-3.2.2, text: "FIFO full, out_ready 0, in_valid 1: no word accepted, in_ready 0", vps: VPS-06}
  - {id: C3, req: REQ-3.3.3, text: "rst_n 0 while words are held: all are discarded", vps: VPS-09}
registers: []
errata_applied: []
